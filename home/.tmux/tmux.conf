# ~/.tmux/tmux.conf - Optimized for AI Agent Workflows (Claude & Gemini)

# --- General Settings ---
set -g mouse on                       # Enable mouse for scrolling agent logs
set -g history-limit 50000             # Increase scrollback for long reasoning traces
set -g base-index 1                    # Start window numbering at 1
setw -g pane-base-index 1              # Start pane numbering at 1
set -s escape-time 0                   # Address vim mode switching delay

# --- Keybindings ---
# Change prefix to Ctrl-a (optional, but common for one-handed use)
# unbind C-b
# set-option -g prefix C-a
# bind-C-a send-prefix

# Reload config easily
bind r source-file ~/.tmux/tmux.conf \; display "Config Reloaded!"

# --- Generic AI Command Center ---

# 1. Identify Panes (Shows large numbers on screen)
# Press Prefix + Q to see which pane is 1, 2, or 3.
bind-key Q display-panes -d 0

# 2. Flexible Multi-Agent Layout
# Opens two empty side panes. You can run any CLI (Claude, Gemini, etc.) in them.
bind-key L \
    split-window -h -p 35 \; \
    split-window -v -p 50 \; \
    select-pane -t 1 \; \
    display-message "Layout Loaded. Press Prefix+Q to see pane numbers."

# 3. Reload config
bind r source-file ~/.tmux/tmux.conf \; display "Config Reloaded!"

# --- Help ---
bind-key H display-popup -E "echo 'Generic Command Center:'; echo '-------------------------'; echo '1. Use Prefix+L to open agent panes.'; echo '2. Run any AI CLI in Pane 2 or 3.'; echo '3. In Pane 1, use: ask-ai [PANE#] \"task\"'; echo '4. Use Prefix+Q to check pane numbers.'; echo ''; read -p 'Press Enter to close...'"

# --- Visuals ---
# Status bar coloring to distinguish "Agent Sessions"
set -g status-style bg=black,fg=cyan
set -g status-left-length 40
# Claude mode badge: @claude_mode pane option set by ~/.claude/hooks/session-mode.sh
set -g status-left "[#S] #{?#{==:#{@claude_mode},TEAM},#[fg=black#,bg=green] TEAM #[default] ,}#{?#{==:#{@claude_mode},TEAMMATE},#[fg=black#,bg=yellow] MATE #[default] ,}#{?#{==:#{@claude_mode},SOLO},#[fg=black#,bg=cyan] SOLO #[default] ,}"
set -g status-right "#(whoami)@#H #[fg=yellow]%H:%M:%S"

# Highlight active agent pane
set -g pane-active-border-style fg=magenta,bg=default
set -g mouse on

# --- Claude team mode (c-team): lead full screen, teammates one key away ---
# Script: ~/.claude/hooks/tmux-team-layout.sh. Acts only in windows holding a TEAM lead pane.
set-hook -g after-split-window 'run-shell -b "~/.claude/hooks/tmux-team-layout.sh #{window_id}"'
set-hook -g after-kill-pane    'run-shell -b "~/.claude/hooks/tmux-team-layout.sh #{window_id}"'
set-hook -g pane-exited        'run-shell -b "~/.claude/hooks/tmux-team-layout.sh #{window_id}"'
# prefix Tab / Shift-Tab: next / previous agent full screen. prefix 0: lead. prefix a: pick. prefix z: all side by side.
bind Tab  select-pane -Z -t :.+ \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z'
bind BTab select-pane -Z -t :.- \; if -F '#{window_zoomed_flag}' '' 'resize-pane -Z'
bind 0 run-shell '~/.claude/hooks/tmux-team-layout.sh #{window_id} lead'
bind a run-shell '~/.claude/hooks/tmux-team-layout.sh #{window_id} menu'
# Status: one colored dot per teammate in this window, underlined = the one you are viewing.
set -g status-left-length 120
set -ga status-left "#{P:#{?#{@agent_name},#[fg=#{@agent_color}]#{?pane_active,#[underscore],}● #{@agent_name}#[default] ,}}"
set -g status-right "#{?@wf_team,#{@wf_team}  ,}#{?#{P:#{@agent_name}},#[fg=colour244]Tab next · 0 lead · a pick · z all  #[default],}#(whoami)@#H #[fg=yellow]%H:%M:%S"
